<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rafah — 3D map</title>
    <link
      href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <div id="map"></div>

    <header class="panel">
      <p class="eyebrow">3D map</p>
      <h1>Rafah <span lang="ar">رفح</span></h1>
      <p class="sub" id="status">Loading Rafah…</p>

      <label class="date-field">
        <span>Map view</span>
        <select id="data-source">
          <option value="osm" selected>OpenStreetMap</option>
          <option value="basemap">Basemap (AUB)</option>
          <option value="damage">Damage (AUB)</option>
          <option value="3d-map">3D Map (AUB)</option>
          <option value="people">People &amp; Place (AUB)</option>
          <option value="heritage">Heritage (AUB)</option>
        </select>
        <p id="data-note" class="date-note">Current OpenStreetMap footprints.</p>
      </label>

      <div id="damage-stats" class="damage-stats" hidden></div>

      <label class="date-field">
        <span>Rafah date</span>
        <input id="rafah-date" type="date" min="2000-01-01" max="2026-10-18" value="2026-10-18" />
        <p id="imagery-note" class="date-note">Loading photos…</p>
      </label>

      <div class="toggles">
        <label><input id="layer-satellite" type="checkbox" checked /> Satellite</label>
        <label><input id="layer-streets" type="checkbox" /> Streets</label>
        <label><input id="layer-buildings" type="checkbox" checked /> Buildings</label>
        <label><input id="layer-roads" type="checkbox" checked /> Roads</label>
        <label><input id="layer-boundary" type="checkbox" checked /> Boundary</label>
        <label><input id="layer-terrain" type="checkbox" checked /> Terrain</label>
      </div>

      <label class="slider">
        <span>Terrain relief <output id="terrain-out">2.2</output></span>
        <input id="terrain-scale" type="range" min="1" max="4" step="0.1" value="2.2" />
      </label>
      <label class="slider">
        <span>Building height <output id="height-out">1.0</output></span>
        <input id="height-scale" type="range" min="0.4" max="2.5" step="0.1" value="1" />
      </label>

      <div class="actions">
        <button id="view-city" type="button">City</button>
        <button id="view-gov" type="button">Governorate</button>
        <button id="tilt" type="button">Tilt</button>
      </div>
    </header>

    <aside id="popup" class="popup" hidden></aside>

    <footer class="credits" id="credits">
      Buildings, roads, and boundary from
      <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>.
      Elevation from AWS Terrain Tiles (Terrarium).
      Extra views from
      <a href="https://experience.arcgis.com/experience/5c24d93ffc234d709efbbeb355d9496c/page/Page?views=3D-Map">Tracking The Urbicide in Gaza</a>
      (AUB): Basemap, Damage, 3D Map, People &amp; Place, Heritage.
      The date changes the satellite photo.
    </footer>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js?v=10"></script>
  </body>
</html>
